# /etc/nginx/sites-available/mitunel.conf

# 1. Redirección HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mitunel.dev *.mitunel.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Control Plane & Billing API (api.mitunel.dev)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mitunel.dev;

    # Certificados Wildcard Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/mitunel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mitunel.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Tunnel Proxy Server & WebSocket Gateway (*.mitunel.dev)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mitunel.dev *.mitunel.dev;

    # Certificados Wildcard Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/mitunel.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mitunel.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    # Buffer tuning para baja latencia en túneles
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Soporte nativo para WebSockets y multiplexación
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Preservar el subdominio original en la cabecera Host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
